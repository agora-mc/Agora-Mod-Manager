[package]
name = "agora-desktop"
version = "0.9.5"
description = "Agora, a multi-game mod manager"
authors = ["Agora Contributors"]
edition = "2021"

[lib]
name = "agora_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agora-core = { path = "../../crates/agora-core" }
# The game contract's types (GameDefinition, ToolId) that the tools commands name.
agora-game-api = { path = "../../crates/agora-game-api" }
agora-game-minecraft = { path = "../../crates/agora-game-minecraft" }
agora-plugin-api = { path = "../../crates/agora-plugin-api" }
# The desktop adapter supplies the script host implementation core asks for.
agora-plugin-host = { path = "../../crates/agora-plugin-host" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
urlencoding = "2"
trash = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dirs = "5"
sysinfo = { workspace = true }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rfd = "0.14"

ed25519-dalek = { version = "2", features = ["alloc"] }
zip = { version = "9", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2", "time", "zstd"] }
keyring = "2"
aes-gcm = "0.10"
pbkdf2 = "0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"

# Reading an exe's icon is a Windows platform primitive (games/icons.rs).
# Versions match what Cargo.lock already carries.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"

[dev-dependencies]
# Test helper only: the Skyrim definition ships as an official plugin.
agora-game-creation = { path = "../../crates/agora-game-creation" }
