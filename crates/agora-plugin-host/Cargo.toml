[package]
name = "agora-plugin-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "QuickJS implementation of the Agora plugin script host."

[dependencies]
agora-plugin-api = { path = "../agora-plugin-api" }
rquickjs = { version = "0.13", features = ["futures", "macro", "loader", "parallel"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
wasmtime = { version = "50", default-features = false, features = ["runtime", "std", "cranelift", "async", "component-model", "cache", "parallel-compilation"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p1"] }

[dev-dependencies]
base64 = { workspace = true }
esplugin = "6.1"
sha1 = { workspace = true }
tempfile = { workspace = true }
wasm-encoder = "0.261"
