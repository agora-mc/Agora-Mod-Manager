[package]
name = "agora-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Agora launcher core — shared business logic for the Tauri GUI, CLI, and MCP listener"

[lib]
name = "agora_core"
path = "src/lib.rs"

# A test tool that does the file operations some tests need, instead of a copy of the machine's
# `cmd.exe`. Integration tests reach it through `CARGO_BIN_EXE_agora-tool-test-helper`.
[[bin]]
name = "agora-tool-test-helper"
path = "src/bin/agora-tool-test-helper.rs"

# A stand-in for a game that exits with a chosen code, crashes, or starts a child and exits first
# (the shape of `skse64_loader.exe`). It lets the session ledger be tested with no game. Tests
# reach it through `CARGO_BIN_EXE_agora-session-crasher`; nothing ships or starts it.
[[bin]]
name = "agora-session-crasher"
path = "src/bin/agora-session-crasher.rs"

[features]
test-support = []

[dependencies]
# The plugin contract. Types only: no script engine, no transport, nothing
# that would breach the "no tauri/clap/MCP in core" rule.
agora-plugin-api = { path = "../agora-plugin-api" }
agora-game-api = { path = "../agora-game-api" }

# Pure logic only. NO tauri, clap, or MCP-protocol crates may appear here —
# the core must stay UI-agnostic so all three front-ends (Tauri GUI, agora
# CLI, agora serve MCP) can consume it equally. (Plan constraint C2/C3.)
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
ed25519-dalek = { workspace = true }
zip = { version = "9", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2", "time", "zstd"] }
sevenz-rust2 = "0.23"
urlencoding = "2"
async-trait = { workspace = true }
keyring = "2"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
base64 = { workspace = true }
uuid = { workspace = true }
sysinfo = { workspace = true }
# OS advisory file locks (flock/LockFileEx). Already in the dependency graph via
# rusty-leveldb, so this adds no crate and no download; the kernel releases the
# lock when the process dies, so a crashed holder never leaves a stale lock.
fs2 = "0.4"
rand = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
flate2 = "1"
# Catalog deltas (MASTER_SPEC §33): a nightly update is a zstd patch against the
# catalog the client already verified, a few KB instead of the whole database.
zstd = "0.13"
roxmltree = "0.20"

# LOOT's plugin header reader (GPL-3.0, the licence Agora itself uses). Header only: the
# Creation Engine load order (MASTER_SPEC §26.6) takes masters and the master and light flags.

# MicrosoftGame.config, read by Microsoft Store game discovery.
quick-xml = "0.39"

# A real file identity for staged view files: inode on Unix, volume serial and
# file index on Windows. Already in the lock through `walkdir`, so this adds no
# download; it lets a swap between the view walk and the hardlink be refused
# instead of trusting timestamps and size.
same-file = "1"

# Reading a Vortex state store (MASTER_SPEC §26.10): LevelDB, pure Rust, MIT.
# Only the Vortex importer opens it, and only a scratch copy.
rusty-leveldb = "4.0.2"

# Directory junctions for shared folders on Windows. `std`'s symlink_dir needs
# Developer Mode or elevation and, when it fails, callers silently fall back to
# copying — which for a *shared* folder means two trees that drift apart with no
# error. Junctions need no elevation and are not in std.
[target.'cfg(windows)'.dependencies]
junction = "2"

# Starting a game under agora_vfs.dll: import-table injection, with a remote thread as the fallback.
# The DLL itself is never linked, only found at runtime.
agora-vfs-inject = { path = "../agora-vfs-inject" }

# Store discovery reads Steam, GOG and Microsoft Store install records from the registry.
winreg = "0.55"

# DPAPI for the credential fallback. Windows Credential Manager caps a secret at
# CRED_MAX_CREDENTIAL_BLOB_SIZE (2560 bytes, so 1280 chars once keyring encodes
# UTF-16), which a Minecraft access token plus an Entra refresh token exceeds on
# every sign-in. DPAPI has no such ceiling and is what Microsoft's own
# msal-extensions uses to persist a token cache on Windows.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# The Linux game view (MASTER_SPEC §26.5): namespaces, mounts and fork/exec for the
# overlayfs over the link deployment. Linux-only; the Windows and macOS builds keep
# the step-down stub and never compile it. Already in the lock through `zip`.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "mount", "process", "sched", "signal", "user"] }

# LevelDB uses POSIX record locks on Unix. Reuse the existing nix dependency for this part.
[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = "3"
# The Vortex import tests build an invented store in the same format Vortex uses.
rusty-leveldb = "4.0.2"
# Test-only. The shipped dependency graph keeps the JS engine out of core —
# core holds `dyn ScriptHost` — but the end-to-end tests are only meaningful
# against the runtime that actually ships.
agora-plugin-host = { path = "../agora-plugin-host" }
